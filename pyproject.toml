[project]
name = "amrita_plugin_memory"
description = "Amrita长期记忆插件"
version = "0.2.4"
dependencies = [
    "aiohttp>=3.13.3",
    "aiologic>=0.16.0",
    "amrita-core>=0.8.5",
    "amrita>=1.3",
    "chromadb>=1.5.8",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
]
readme = "README.md"
requires-python = ">=3.10, <3.14"

[tool.nonebot]
plugins = [
    "nonebot_plugin_orm",
    "nonebot_plugin_apscheduler",
]
plugin_dirs = []

[tool.setuptools.packages.find]
include = ["amrita_plugin_memory", "amrita_plugin_memory.*"]

[[tool.nonebot.adapters]]
name = "OneBot V11"
module_name = "nonebot.adapters.onebot.v11"

[tool.uv]
dev-dependencies = [
    "ruff>=0.12.8",
    "nonebot-plugin-orm[default]>=0.8.2",
    #"pytest>=8.4.1",
    "ambot-inlinectl>=0.1.2",
]
package = true

[tool.ruff]
line-length = 88
target-version = "py310"
[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "T10",   # flake8-debugger
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RUF",   # Ruff-specific rules
    "I",     # isort
    "PERF",  # pylint-performance
]
ignore = [
    "E402",   # module-import-not-at-top-of-file
    "E501",   # line-too-long
    "UP037",  # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.pyright]
typeCheckingMode = "standard"

[tool.amrita]
plugins=["amrita_plugin_memory"]
